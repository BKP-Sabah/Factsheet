<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Fact Sheet Cawangan Penjagaan</title>
<style>
:root{
  --bg:#f6f8fc;--surface:rgba(255,255,255,.94);--surface2:#eef3fb;--surface3:#f8fafc;
  --border:rgba(36,54,101,.12);--border-strong:rgba(37,99,235,.22);
  --text:#122033;--text-dim:#64748b;--muted:#94a3b8;--accent:#1d4ed8;
  --green:#15803d;--green-dim:rgba(22,163,74,.12);--amber:#b7791f;--amber-dim:rgba(245,158,11,.14);
  --red:#b91c1c;--red-dim:rgba(239,68,68,.12);--purple:#7c3aed;--purple-dim:rgba(124,58,237,.10);
  --shadow:0 20px 55px rgba(15,23,42,.08);--shadow-soft:0 10px 30px rgba(15,23,42,.06);--radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0} html{scroll-behavior:smooth}
body{min-height:100vh;overflow-x:hidden;color:var(--text);font-family:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;background:radial-gradient(circle at top left,rgba(37,99,235,.14),transparent 30%),radial-gradient(circle at 90% 12%,rgba(20,184,166,.12),transparent 28%),linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.03) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 55%)}
.app{position:relative;z-index:1;max-width:1550px;margin:0 auto;padding:34px 34px 52px}
.header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin-bottom:22px;padding:30px;border:1px solid var(--border);border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(239,246,255,.92)),var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative}
.header::after{content:"";position:absolute;width:340px;height:340px;border-radius:999px;right:-145px;top:-170px;background:radial-gradient(circle,rgba(37,99,235,.18),transparent 70%)}.header>*{position:relative;z-index:1}
.header h1{font-size:clamp(34px,4vw,54px);line-height:.98;letter-spacing:-1.8px;font-weight:900;max-width:980px}.header h1 span{color:var(--accent);background:linear-gradient(90deg,#1d4ed8,#0f766e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.header-sub{margin-top:14px;color:var(--text-dim);font-size:20px;font-weight:600;line-height:1.45}
.period-badge{display:inline-flex;align-items:center;justify-content:center;min-width:220px;background:#fff;border:1px solid var(--border-strong);border-radius:999px;padding:14px 24px;color:var(--accent);font-weight:900;box-shadow:var(--shadow-soft);white-space:nowrap}.data-source{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--border);font-size:14px;font-weight:800;color:var(--text-dim)}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.12);display:inline-block}
.nav-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding:7px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.68);box-shadow:0 8px 22px rgba(15,23,42,.04);scrollbar-width:thin}.nav-tab{padding:13px 20px;border-radius:13px;font-size:16px;font-weight:900;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text-dim);transition:all .2s ease;white-space:nowrap}.nav-tab:hover{color:var(--accent);background:rgba(37,99,235,.07)}.nav-tab.active{background:#fff;color:var(--accent);border-color:var(--border-strong);box-shadow:0 9px 22px rgba(37,99,235,.10)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.search,.select{border:1px solid var(--border);border-radius:999px;padding:12px 16px;font:inherit;font-size:15px;background:#fff;box-shadow:var(--shadow-soft)}.search{flex:1 1 260px;min-width:220px;color:var(--text)}.select{font-weight:800;color:var(--text-dim)}
.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:22px}.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 22px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-soft);min-height:136px}.summary-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent)}.summary-card::after{content:"";position:absolute;right:-38px;top:-50px;width:120px;height:120px;border-radius:999px;background:rgba(37,99,235,.08)}.summary-card.green::before{background:linear-gradient(90deg,var(--green),#22c55e)}.summary-card.green::after{background:var(--green-dim)}.summary-card.amber::before{background:linear-gradient(90deg,var(--amber),#f59e0b)}.summary-card.amber::after{background:var(--amber-dim)}.summary-card.red::before{background:linear-gradient(90deg,var(--red),#ef4444)}.summary-card.red::after{background:var(--red-dim)}.summary-card.purple::before{background:linear-gradient(90deg,var(--purple),#a78bfa)}.summary-card.purple::after{background:var(--purple-dim)}.summary-card .label{position:relative;z-index:1;font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-dim);margin-bottom:12px;font-weight:900}.summary-card .value{position:relative;z-index:1;font-size:clamp(30px,3.2vw,42px);letter-spacing:-1.6px;line-height:1;font-weight:900}.summary-card .sub{position:relative;z-index:1;font-size:15px;color:var(--text-dim);margin-top:10px;line-height:1.35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-soft);overflow:hidden}.panel.full{grid-column:1/-1}.panel-title{font-size:22px;font-weight:900;margin-bottom:5px;letter-spacing:-.4px}.panel-sub{font-size:15px;color:var(--text-dim);margin-bottom:18px;line-height:1.45}.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.module-card{border:1px solid var(--border);background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow-soft);cursor:pointer;transition:.2s ease;position:relative;overflow:hidden}.module-card:hover{transform:translateY(-2px);border-color:var(--border-strong)}.module-card .type{display:inline-flex;border:1px solid var(--border);background:var(--surface3);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}.module-card h3{margin:10px 0 8px;font-size:18px;letter-spacing:-.25px;line-height:1.2}.module-card p{color:var(--text-dim);font-size:14px;line-height:1.35}.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{display:inline-flex;border-radius:999px;padding:6px 9px;background:var(--surface2);color:var(--text-dim);font-size:12px;font-weight:900}.chip.red{color:var(--red);background:var(--red-dim)}.chip.amber{color:var(--amber);background:var(--amber-dim)}.chip.green{color:var(--green);background:var(--green-dim)}.chip.purple{color:var(--purple);background:var(--purple-dim)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px;background:#fff}table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid rgba(15,23,42,.08);border-right:1px solid rgba(15,23,42,.06);text-align:left;vertical-align:top;font-size:14px}th{position:sticky;top:0;z-index:2;background:var(--surface2);color:var(--text);font-weight:900}td{color:var(--text);background:#fff}tr:hover td{background:#f8fafc}
.bar-chart{display:flex;flex-direction:column;gap:12px}.bar-row{display:grid;grid-template-columns:190px minmax(120px,1fr) 86px;align-items:center;gap:14px}.bar-label{font-size:14px;color:var(--text-dim);text-align:right;font-weight:900}.bar-track{height:30px;background:var(--surface2);border-radius:999px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(30,41,59,.04)}.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#1d4ed8,#0f766e);min-width:2px}.bar-fill.red{background:linear-gradient(90deg,#dc2626,#ef4444)}.bar-fill.amber{background:linear-gradient(90deg,#d97706,#f59e0b)}.bar-fill.green{background:linear-gradient(90deg,#15803d,#22c55e)}.bar-target{position:absolute;top:0;height:100%;width:2px;background:#0f172a;opacity:.38}.bar-value{font-size:14px;font-weight:900;text-align:right}.line-svg{width:100%;height:280px;border:1px solid rgba(15,23,42,.06);border-radius:14px;background:linear-gradient(180deg,var(--surface3),#fff)}.notice{border:1px solid var(--border-strong);background:rgba(37,99,235,.05);border-radius:18px;padding:16px 18px;color:var(--text-dim);line-height:1.55;font-size:15px;font-weight:700}.notice strong{color:var(--text)}.notice.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08)}.notice.bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}.footer-bar{text-align:center;padding:28px 0 8px;font-size:14px;color:var(--text-dim);border-top:1px solid var(--border);margin-top:36px}.loading{text-align:center;padding:70px 20px;color:var(--text-dim);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-soft);font-size:16px;font-weight:800}.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}.tiny{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.25}
@media(max-width:1000px){.header{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.bar-row{grid-template-columns:130px minmax(90px,1fr) 70px}}
@media(max-width:720px){.app{padding:16px 14px}.header{padding:20px;border-radius:20px}.header h1{font-size:28px}.header-sub{font-size:16px}.summary-row{grid-template-columns:1fr 1fr;gap:10px}.summary-card{padding:16px;min-height:116px;border-radius:16px}.summary-card .label{font-size:11px}.summary-card .value{font-size:26px}.nav-tab{font-size:13px;padding:10px 13px}.panel{padding:16px;border-radius:16px}.bar-row{grid-template-columns:105px minmax(80px,1fr) 60px;gap:8px}.bar-label,.bar-value{font-size:12px}}
@media print{body{background:#fff;font-size:11px}body::before,.nav-tabs,.toolbar{display:none!important}.header,.summary-card,.panel{box-shadow:none;border:1px solid #ddd}.panel{break-inside:avoid}@page{margin:1.5cm;size:A4 landscape}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>Dashboard Fact Sheet <span>Cawangan Penjagaan</span></h1>
      <div class="header-sub">Bahagian Kesihatan Pergigian Negeri Sabah · Dashboard eksekutif berasaskan Master_Data</div>
      <div class="data-source"><span class="dot" id="sourceDot"></span><span id="sourceStatus">Memuatkan Master_Data...</span></div>
    </div>
    <div class="period-badge" id="periodBadge">Memuatkan...</div>
  </div>
  <div class="nav-tabs" id="mainTabs">
    <button class="nav-tab active" data-view="overview">RINGKASAN</button>
    <button class="nav-tab" data-view="category">KATEGORI</button>
    <button class="nav-tab" data-view="trend">TREND</button>
    <button class="nav-tab" data-view="ranking">RANKING KAWASAN</button>
    <button class="nav-tab" data-view="issues">ISU SASARAN</button>
    <button class="nav-tab" data-view="table">JADUAL RINGKAS</button>
    <button class="nav-tab" data-view="quality">SEMAKAN DATA</button>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div><br>Memuatkan data...</div></div>
  <div class="footer-bar">Copyright &copy; Bahagian Kesihatan Pergigian Negeri Sabah. All rights reserved.</div>
</div>
<script>
const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIQGf-F_JZBE-PYUunzg_nlIMnrLsEQsgLUiIMWTWlvYLeAi2_lz4M27wGKRNBdv-Bua0Aqm9inBcs/pub?gid=808112216&single=true&output=csv";
let DATA=[], HEADERS=[], FILTER={category:'',indicator:'',year:'',query:''};
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function parseCSV(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'&&q&&nx==='"'){cur+='"';i++;}else if(ch==='"'){q=!q;}else if(ch===','&&!q){row.push(cur.trim());cur='';}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cur.trim());if(row.some(c=>c!==''))rows.push(row);row=[];cur='';}else cur+=ch;}row.push(cur.trim());if(row.some(c=>c!==''))rows.push(row);return rows;}
function normalise(h){return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');}
function pick(obj,names){for(const n of names){if(obj[n]!==undefined)return obj[n];}return '';}
function toNum(v){if(v===null||v===undefined||v==='')return null;if(String(v).match(/^#|error/i))return null;const n=parseFloat(String(v).replace(/,/g,'').replace('%',''));return Number.isFinite(n)?n:null;}
function isErr(v){return /^#/.test(String(v||''));}
function uniq(a){return [...new Set(a.filter(v=>v!==''&&v!=null))];}
function latestYear(rows=DATA){const ys=uniq(rows.map(r=>r.Year)).map(Number).filter(Number.isFinite);return ys.length?String(Math.max(...ys)):'';}
function displayName(r){return r.Indicator_Name||r.Indicator_Code||'Indicator';}
function fmt(v,unit=''){const n=toNum(v);if(n===null)return '—';if(String(unit).includes('%'))return n.toFixed(1)+'%';if(Math.abs(n)>=1000)return n.toLocaleString(undefined,{maximumFractionDigits:0});return n.toLocaleString(undefined,{maximumFractionDigits:2}).replace(/\.00$/,'');}
function statusClass(value,target,direction){const v=toNum(value),t=toNum(target);if(v===null||t===null)return '';const dir=String(direction||'Higher better').toLowerCase();if(dir.includes('lower')){if(v<=t)return 'green';if(v<=t*1.3)return 'amber';return 'red';}if(dir.includes('context'))return 'purple';const ratio=v/t;if(ratio>=.9)return 'green';if(ratio>=.7)return 'amber';return 'red';}
async function load(){try{const res=await fetch(MASTER_CSV_URL,{cache:'no-store'});if(!res.ok)throw new Error('CSV '+res.status);const rows=parseCSV(await res.text());HEADERS=rows[0]||[];const norm=HEADERS.map(normalise);DATA=rows.slice(1).map((r,i)=>{const raw={_row:i+2};norm.forEach((h,j)=>raw[h]=r[j]??'');return {
  _row:raw._row,Category:pick(raw,['category']),Section:pick(raw,['section']),Indicator_Code:pick(raw,['indicator_code','kod_indicator','kod_indikator']),Indicator_Name:pick(raw,['indicator_name','indicator','indikator']),Year:pick(raw,['year','tahun']),Period:pick(raw,['period','tempoh']),Geography_Level:pick(raw,['geography_level','peringkat']),Kawasan:pick(raw,['kawasan','district','daerah']),Subgroup:pick(raw,['subgroup','kumpulan']),Numerator:pick(raw,['numerator','pengangka']),Denominator:pick(raw,['denominator','penyebut']),Value:pick(raw,['value','nilai']),Unit:pick(raw,['unit']),Target:pick(raw,['target','sasaran']),Direction:pick(raw,['direction','arah']),Source_Tab:pick(raw,['source_tab','tab_sumber']),Source_Cell:pick(raw,['source_cell','sel_sumber']),Dashboard_Ready:pick(raw,['dashboard_ready']),_raw:raw
};}).filter(r=>Object.values(r).some(v=>String(v||'').trim()!==''));setSource(true);boot();}catch(e){console.error(e);setSource(false,e.message);document.getElementById('content').innerHTML=`<div class="panel full"><div class="panel-title">Dashboard tidak dapat membaca Master_Data</div><div class="panel-sub">Semak published CSV link dan akses Google Sheet.</div><div class="notice bad"><strong>Ralat:</strong> ${esc(e.message)}</div></div>`;}}
function setSource(ok,msg=''){const dot=document.getElementById('sourceDot'),st=document.getElementById('sourceStatus');if(ok){dot.style.background='var(--green)';dot.style.boxShadow='0 0 0 4px rgba(22,163,74,.12)';st.textContent='Sumber live: Master_Data CSV aktif';}else{dot.style.background='var(--red)';dot.style.boxShadow='0 0 0 4px rgba(239,68,68,.12)';st.textContent='Sumber gagal dimuat: '+msg;}}
function boot(){const y=latestYear();document.getElementById('periodBadge').textContent=y?`Tahun terkini: ${y}`:'Master_Data';document.getElementById('mainTabs').addEventListener('click',e=>{const b=e.target.closest('.nav-tab');if(!b)return;document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.view);});render('overview');}
function latestRows(){const y=latestYear();return DATA.filter(r=>String(r.Year)===y && toNum(r.Value)!==null);}function targetedRows(rows=DATA){return rows.filter(r=>toNum(r.Value)!==null && toNum(r.Target)!==null && !String(r.Direction||'').toLowerCase().includes('context'));}
function cards(){const latest=latestRows();const cats=uniq(DATA.map(r=>r.Category));const inds=uniq(DATA.map(r=>displayName(r)));const targeted=targetedRows(latest);const good=targeted.filter(r=>statusClass(r.Value,r.Target,r.Direction)==='green').length;const pct=targeted.length?good/targeted.length*100:null;return `<div class="summary-row">
<div class="summary-card purple"><div class="label">Kategori</div><div class="value">${cats.length}</div><div class="sub">Kumpulan fact sheet utama</div></div>
<div class="summary-card"><div class="label">Indikator</div><div class="value">${inds.length}</div><div class="sub">Auto-detect daripada Master_Data</div></div>
<div class="summary-card green"><div class="label">Data Terkini</div><div class="value">${latest.length.toLocaleString()}</div><div class="sub">Rows bernilai untuk ${latestYear()||'tahun terkini'}</div></div>
<div class="summary-card ${pct===null?'amber':pct>=80?'green':pct>=50?'amber':'red'}"><div class="label">Status Sasaran</div><div class="value">${pct===null?'—':pct.toFixed(0)+'%'}</div><div class="sub">Indikator terkini mencapai / hampir capai sasaran</div></div>
</div>`;}
function render(view){if(view==='overview')return renderOverview();if(view==='category')return renderCategory();if(view==='trend')return renderTrend();if(view==='ranking')return renderRanking();if(view==='issues')return renderIssues();if(view==='table')return renderTable();if(view==='quality')return renderQuality();}
function renderOverview(){const latest=latestRows();const issues=targetedRows(latest).filter(r=>['red','amber'].includes(statusClass(r.Value,r.Target,r.Direction))).slice(0,8);const topCats=uniq(DATA.map(r=>r.Category)).map(c=>({c,rows:DATA.filter(r=>r.Category===c),latest:latest.filter(r=>r.Category===c)}));let html=cards();html+=`<div class="grid"><div class="panel"><div class="panel-title">Ringkasan Kategori</div><div class="panel-sub">Paparan eksekutif mengikut kategori utama, bukan paparan semua raw data.</div><div class="module-grid">${topCats.map(x=>`<div class="module-card" onclick="FILTER.category='${esc(x.c)}';renderCategory();document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.view==='category'))"><span class="type">Kategori</span><h3>${esc(x.c||'Tanpa kategori')}</h3><p>${uniq(x.rows.map(r=>r.Section)).length} seksyen · ${uniq(x.rows.map(r=>displayName(r))).length} indikator</p><div class="chip-row"><span class="chip green">${x.latest.length} rows terkini</span><span class="chip">${uniq(x.rows.map(r=>r.Year)).length} tahun</span></div></div>`).join('')}</div></div><div class="panel"><div class="panel-title">Isu Yang Perlu Perhatian</div><div class="panel-sub">Berdasarkan rows terkini yang mempunyai sasaran.</div>${issues.length?issues.map(r=>`<div class="notice ${statusClass(r.Value,r.Target,r.Direction)==='red'?'bad':'warn'}" style="margin-bottom:10px"><strong>${esc(displayName(r))}</strong><br>${esc(r.Kawasan||r.Section)} · ${fmt(r.Value,r.Unit)} berbanding sasaran ${fmt(r.Target,r.Unit)}</div>`).join(''):`<div class="notice"><strong>Tiada isu utama dikesan</strong><br>Masukkan sasaran dan nilai untuk membolehkan sistem mengenal pasti isu.</div>`}</div></div>`;document.getElementById('content').innerHTML=html;}
function renderCategory(){const cats=uniq(DATA.map(r=>r.Category));const cat=FILTER.category||cats[0]||'';FILTER.category=cat;const rows=DATA.filter(r=>r.Category===cat);const secs=uniq(rows.map(r=>r.Section));let html=`<div class="toolbar"><select class="select" onchange="FILTER.category=this.value;renderCategory()">${cats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select><input class="search" placeholder="Cari indikator / seksyen..." oninput="FILTER.query=this.value;renderCategory()" value="${esc(FILTER.query)}"></div>`;html+=`<div class="summary-row"><div class="summary-card purple"><div class="label">Kategori Dipilih</div><div class="value">${secs.length}</div><div class="sub">Bilangan seksyen dalam ${esc(cat)}</div></div><div class="summary-card"><div class="label">Indikator</div><div class="value">${uniq(rows.map(r=>displayName(r))).length}</div><div class="sub">Dalam kategori ini</div></div><div class="summary-card green"><div class="label">Tahun</div><div class="value">${uniq(rows.map(r=>r.Year)).length}</div><div class="sub">Julat data tersedia</div></div></div>`;const q=String(FILTER.query||'').toLowerCase();const groups=secs.map(s=>({s,rows:rows.filter(r=>r.Section===s && (!q||(displayName(r)+' '+r.Section).toLowerCase().includes(q)))})).filter(x=>x.rows.length);html+=`<div class="module-grid">${groups.map(g=>{const latest=latestYear(g.rows);const rLatest=g.rows.filter(r=>String(r.Year)===latest);const target=targetedRows(rLatest);const good=target.filter(r=>statusClass(r.Value,r.Target,r.Direction)==='green').length;return `<div class="module-card"><span class="type">Seksyen</span><h3>${esc(g.s||'Tanpa seksyen')}</h3><p>${uniq(g.rows.map(r=>displayName(r))).length} indikator · tahun terkini ${latest||'—'}</p><div class="chip-row"><span class="chip green">${rLatest.filter(r=>toNum(r.Value)!==null).length} data terkini</span>${target.length?`<span class="chip ${good/target.length>=.8?'green':good/target.length>=.5?'amber':'red'}">${good}/${target.length} capai sasaran</span>`:''}</div></div>`}).join('')}</div>`;document.getElementById('content').innerHTML=html;}
function indicatorOptions(){return uniq(DATA.map(r=>displayName(r))).sort();}
function renderTrend(){const opts=indicatorOptions();const ind=FILTER.indicator||opts[0]||'';FILTER.indicator=ind;const rows=DATA.filter(r=>displayName(r)===ind && toNum(r.Value)!==null);const geo=rows.find(r=>/sabah/i.test(r.Kawasan||''))?rows.filter(r=>/sabah/i.test(r.Kawasan||'')):rows;const byYear={};geo.forEach(r=>{const y=String(r.Year);if(!/^20\d{2}$/.test(y))return;if(!byYear[y])byYear[y]=[];byYear[y].push(toNum(r.Value));});const pts=Object.keys(byYear).sort().map(y=>({year:y,value:byYear[y].reduce((a,b)=>a+b,0)/byYear[y].length}));let html=`<div class="toolbar"><select class="select" onchange="FILTER.indicator=this.value;renderTrend()">${opts.map(o=>`<option ${o===ind?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;html+=`<div class="panel full"><div class="panel-title">Trend Tahunan</div><div class="panel-sub">${esc(ind)} · ${pts.length?pts[0].year+'–'+pts[pts.length-1].year:'tiada nilai numerik'}</div>${drawLine(pts,rows[0]?.Unit||'')}<div class="tiny" style="margin-top:12px">Nota: Jika row Sabah tersedia, trend menggunakan nilai Sabah. Jika tiada, dashboard menggunakan purata nilai kawasan.</div></div>`;document.getElementById('content').innerHTML=html;}
function drawLine(pts,unit){if(!pts.length)return `<div class="notice warn">Belum ada nilai numerik untuk indikator ini.</div>`;const w=900,h=280,p=42;const vals=pts.map(d=>d.value);let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min=min-1;max=max+1;}const x=i=>p+(i/(Math.max(pts.length-1,1)))*(w-p*2);const y=v=>h-p-((v-min)/(max-min))*(h-p*2);const d=pts.map((pt,i)=>`${i?'L':'M'}${x(i)},${y(pt.value)}`).join(' ');return `<svg class="line-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><g>${[0,.25,.5,.75,1].map(t=>{const yy=p+t*(h-p*2);return `<line x1="${p}" x2="${w-p}" y1="${yy}" y2="${yy}" stroke="rgba(15,23,42,.08)"/>`;}).join('')}</g><path d="${d}" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((pt,i)=>`<circle cx="${x(i)}" cy="${y(pt.value)}" r="6" fill="#1d4ed8"/><text x="${x(i)}" y="${h-14}" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">${pt.year}</text><text x="${x(i)}" y="${y(pt.value)-12}" text-anchor="middle" font-size="13" font-weight="900" fill="#122033">${fmt(pt.value,unit)}</text>`).join('')}</svg>`;}
function renderRanking(){const opts=indicatorOptions();const years=uniq(DATA.map(r=>r.Year)).sort();const ind=FILTER.indicator||opts[0]||'';const year=FILTER.year||latestYear();FILTER.indicator=ind;FILTER.year=year;let rows=DATA.filter(r=>displayName(r)===ind && String(r.Year)===String(year) && toNum(r.Value)!==null && r.Kawasan && !/sabah/i.test(r.Kawasan));if(!rows.length)rows=DATA.filter(r=>displayName(r)===ind && String(r.Year)===String(year) && toNum(r.Value)!==null);const direction=rows[0]?.Direction||'Higher better';const lower=String(direction).toLowerCase().includes('lower');rows.sort((a,b)=>lower?toNum(a.Value)-toNum(b.Value):toNum(b.Value)-toNum(a.Value));const max=Math.max(...rows.map(r=>toNum(r.Value)||0),toNum(rows[0]?.Target)||0,1);let html=`<div class="toolbar"><select class="select" onchange="FILTER.indicator=this.value;renderRanking()">${opts.map(o=>`<option ${o===ind?'selected':''}>${esc(o)}</option>`).join('')}</select><select class="select" onchange="FILTER.year=this.value;renderRanking()">${years.map(y=>`<option ${y===year?'selected':''}>${esc(y)}</option>`).join('')}</select></div>`;html+=`<div class="panel full"><div class="panel-title">Ranking Kawasan</div><div class="panel-sub">${esc(ind)} · ${esc(year)} · susunan ${lower?'rendah ke tinggi':'tinggi ke rendah'}</div>${rows.length?`<div class="bar-chart">${rows.slice(0,30).map(r=>{const cls=statusClass(r.Value,r.Target,r.Direction);const pct=Math.max(2,Math.min(100,(toNum(r.Value)/max)*100));const tp=toNum(r.Target)!==null?Math.min(100,(toNum(r.Target)/max)*100):null;return `<div class="bar-row"><div class="bar-label">${esc(r.Kawasan)}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div>${tp!==null?`<div class="bar-target" style="left:${tp}%"></div>`:''}</div><div class="bar-value">${fmt(r.Value,r.Unit)}</div></div>`}).join('')}</div>`:`<div class="notice warn">Tiada data kawasan untuk pilihan ini.</div>`}</div>`;document.getElementById('content').innerHTML=html;}
function renderIssues(){const y=latestYear();const rows=targetedRows(DATA.filter(r=>String(r.Year)===y));const issues=rows.filter(r=>['red','amber'].includes(statusClass(r.Value,r.Target,r.Direction))).sort((a,b)=>statusClass(a.Value,a.Target,a.Direction)==='red'?-1:1);let html=cards();html+=`<div class="panel full"><div class="panel-title">Isu Sasaran Tahun Terkini</div><div class="panel-sub">Rows yang belum capai atau hampir capai sasaran. Paparan ini lebih sesuai untuk mesyuarat pemantauan.</div>${issues.length?`<div class="table-wrap"><table><thead><tr><th>Status</th><th>Kategori</th><th>Indikator</th><th>Kawasan</th><th>Nilai</th><th>Sasaran</th><th>Sumber</th></tr></thead><tbody>${issues.slice(0,250).map(r=>{const cls=statusClass(r.Value,r.Target,r.Direction);return `<tr><td><span class="chip ${cls}">${cls==='red'?'Belum capai':'Hampir capai'}</span></td><td>${esc(r.Category)}</td><td><strong>${esc(displayName(r))}</strong><div class="tiny">${esc(r.Section)}</div></td><td>${esc(r.Kawasan)}</td><td>${fmt(r.Value,r.Unit)}</td><td>${fmt(r.Target,r.Unit)}</td><td>${esc(r.Source_Tab)} ${esc(r.Source_Cell)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="notice">Tiada isu sasaran dikesan untuk tahun terkini.</div>`}</div>`;document.getElementById('content').innerHTML=html;}
function filteredRows(){let rows=DATA.filter(r=>toNum(r.Value)!==null);if(FILTER.category)rows=rows.filter(r=>r.Category===FILTER.category);const q=String(FILTER.query||'').toLowerCase();if(q)rows=rows.filter(r=>(r.Category+' '+r.Section+' '+displayName(r)+' '+r.Kawasan+' '+r.Year).toLowerCase().includes(q));return rows;}
function renderTable(){const cats=uniq(DATA.map(r=>r.Category));const rows=filteredRows().slice(0,1000);let html=`<div class="toolbar"><select class="select" onchange="FILTER.category=this.value;renderTable()"><option value="">Semua kategori</option>${cats.map(c=>`<option value="${esc(c)}" ${FILTER.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input class="search" placeholder="Cari kategori / indikator / kawasan..." oninput="FILTER.query=this.value;renderTable()" value="${esc(FILTER.query)}"></div>`;html+=`<div class="panel full"><div class="panel-title">Jadual Ringkas Dashboard</div><div class="panel-sub">Hanya rows bernilai dipaparkan. Had paparan 1000 rows supaya dashboard ringan.</div><div class="table-wrap"><table><thead><tr><th>Kategori</th><th>Seksyen</th><th>Indikator</th><th>Tahun</th><th>Kawasan</th><th>Nilai</th><th>Sasaran</th><th>Status</th></tr></thead><tbody>${rows.map(r=>{const cls=statusClass(r.Value,r.Target,r.Direction);return `<tr><td>${esc(r.Category)}</td><td>${esc(r.Section)}</td><td><strong>${esc(displayName(r))}</strong><div class="tiny">${esc(r.Indicator_Code)}</div></td><td>${esc(r.Year)}</td><td>${esc(r.Kawasan)}</td><td>${fmt(r.Value,r.Unit)}</td><td>${fmt(r.Target,r.Unit)}</td><td>${cls?`<span class="chip ${cls}">${cls==='green'?'Capai':cls==='amber'?'Hampir':cls==='red'?'Belum':'Konteks'}</span>`:'—'}</td></tr>`}).join('')}</tbody></table></div></div>`;document.getElementById('content').innerHTML=html;}
function renderQuality(){const bad=DATA.filter(r=>!/^20\d{2}$/.test(String(r.Year||''))||toNum(r.Value)===null||Object.values(r._raw||{}).some(isErr));const ready=DATA.length-bad.length;let html=`<div class="summary-row"><div class="summary-card green"><div class="label">Rows Bersih</div><div class="value">${ready.toLocaleString()}</div><div class="sub">Boleh digunakan untuk visual</div></div><div class="summary-card ${bad.length?'red':'green'}"><div class="label">Rows Perlu Semak</div><div class="value">${bad.length.toLocaleString()}</div><div class="sub">Blank / error / tahun tidak sah</div></div><div class="summary-card"><div class="label">Jumlah Rows</div><div class="value">${DATA.length.toLocaleString()}</div><div class="sub">Daripada Master_Data</div></div></div>`;html+=`<div class="panel full"><div class="panel-title">Semakan Data</div><div class="panel-sub">Ini bukan tab utama dashboard, tetapi berguna untuk pastikan data tidak rosak sebelum dibentang.</div>${bad.length?`<div class="table-wrap"><table><thead><tr><th>Row</th><th>Indikator</th><th>Tahun</th><th>Kawasan</th><th>Value</th><th>Isu</th><th>Sumber</th></tr></thead><tbody>${bad.slice(0,250).map(r=>{let issue=[];if(!/^20\d{2}$/.test(String(r.Year||'')))issue.push('Tahun tidak sah');if(toNum(r.Value)===null)issue.push('Value kosong/tidak numerik');if(Object.values(r._raw||{}).some(isErr))issue.push('Formula error');return `<tr><td>${r._row}</td><td>${esc(displayName(r))}</td><td>${esc(r.Year)}</td><td>${esc(r.Kawasan)}</td><td>${esc(r.Value)}</td><td><span class="chip red">${esc(issue.join(' · '))}</span></td><td>${esc(r.Source_Tab)} ${esc(r.Source_Cell)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="notice"><strong>Data kelihatan bersih.</strong><br>Tiada isu kritikal dikesan.</div>`}</div>`;document.getElementById('content').innerHTML=html;}
load();
</script>
