.grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }

  return `<div class="panel"><div class="panel-title">Trend Tahunan</div><div class="panel-sub">Siri pertama berasaskan kolum peratus yang dikesan.</div><svg class="line-svg" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#cbd5e1"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#cbd5e1"/><path d="${d}" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${xy(p)[0]}" cy="${xy(p)[1]}" r="5" fill="#1d4ed8"/><text x="${xy(p)[0]}" y="${H-12}" text-anchor="middle" font-size="12" fill="#64748b">${p.y}</text><text x="${xy(p)[0]}" y="${xy(p)[1]-10}" text-anchor="middle" font-size="12" font-weight="700" fill="#122033">${fmt(p.v,true)}</text>`).join('')}</svg></div>`;
}
function renderTable(s) {
  const rows = tableRows(s);
  if (!rows.length) return `<div class="notice">Tiada jadual dikesan untuk tab ini.</div>`;
  const maxCols = Math.max(...rows.map(r=>r.length));
  return `<div class="table-wrap"><table id="dataTable"><tbody>${rows.map((row,ri)=>`<tr>${Array.from({length:maxCols},(_,ci)=>{ const v=row[ci]; const tag=ri<3?'th':'td'; const cls=isErr(v)?'err':isBlank(v)?'empty':''; return `<${tag} class="${cls}">${isBlank(v)?'—':esc(v)}</${tag}>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function filterTableRows(q) {
  q = q.toLowerCase();
  document.querySelectorAll('#dataTable tr').forEach((tr,i) => { if (i<3) return; tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none'; });
}
function renderQuality() {
  const ds=dataSheets();
  const rows = ds.map(s => [s.group, s.name, moduleTypeLabel(s.type), countCells(s), countNumeric(s), countErrors(s), extractYears(s).join(', ')]);
  let html = renderCards([
    {label:'Tab dinilai', value:ds.length, sub:'Semua tab data', color:'purple'},
    {label:'Jumlah error formula', value:ds.reduce((a,s)=>a+countErrors(s),0), sub:'Perlu dibersihkan di Google Sheet', color:ds.reduce((a,s)=>a+countErrors(s),0)?'red':'green'},
    {label:'Tab tanpa nilai numerik', value:ds.filter(s=>countNumeric(s)===0).length, sub:'Carta tidak akan aktif', color:'amber'},
    {label:'Tab district/Kawasan', value:ds.filter(s=>s.type==='district').length, sub:'Sesuai untuk ranking daerah', color:'green'},
  ]);
  html += `<div class="panel full"><div class="panel-title">Semakan Data Mengikut Tab</div><div class="panel-sub">Gunakan jadual ini untuk kenal pasti tab yang belum bersedia untuk paparan rasmi.</div><div class="table-wrap"><table><thead><tr><th>Kategori</th><th>Tab</th><th>Jenis</th><th>Sel berisi</th><th>Nilai numerik</th><th>Error</th><th>Tahun</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===5 && Number(c)>0?'err':''}">${esc(c||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  document.getElementById('content').innerHTML = html;
}
function renderSetup() {
  const example = `const SHEET_CSV_URLS = {
  "Overall WTP x population": "https://docs.google.com/spreadsheets/d/e/.../pub?gid=...&single=true&output=csv",
  "% BK 16yo": "https://docs.google.com/spreadsheets/d/e/.../pub?gid=...&single=true&output=csv"
};`;
  let html = `<div class="panel full"><div class="panel-title">Cara Jadikan Dashboard Ini Live Dari Google Sheet</div><div class="panel-sub">Setiap tab Google Sheet mempunyai gid berbeza, jadi setiap tab perlukan satu published CSV URL.</div><div class="notice"><strong>Langkah:</strong><br>1. Buka tab Google Sheet yang hendak digunakan.<br>2. File → Share → Publish to web → pilih tab tersebut → CSV.<br>3. Salin URL dan tampal dalam objek <code>SHEET_CSV_URLS</code> di bahagian atas HTML.<br>4. Ulang untuk semua tab yang ingin dilive-kan.</div><pre style="white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:16px;padding:18px;margin-top:18px;overflow:auto;font-size:13px;line-height:1.5;">${esc(example)}</pre><div class="notice warn" style="margin-top:18px;"><strong>Cadangan penting:</strong> Untuk paparan rasmi, guna formula Google Sheet seperti <code>=IFERROR(formula, "")</code> supaya #DIV/0! tidak keluar dalam dashboard.</div></div>`;
  document.getElementById('content').innerHTML = html;
}

function setView(view) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view==='overview') renderOverview();
  if (view==='modules') renderModules();
  if (view==='viewer') renderViewer();
  if (view==='quality') renderQuality();
  if (view==='setup') renderSetup();
}
document.getElementById('mainTabs').addEventListener('click', e => { const b=e.target.closest('.nav-tab'); if (!b) return; setView(b.dataset.view); });

loadLiveSources().then(() => { ACTIVE_SHEET = dataSheets()[0]; renderOverview(); });
</script>
</body>
</html>
