<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Fact Sheet Cawangan Penjagaan — Master Data</title>
<style>
:root{
  --bg:#f6f8fc;--surface:rgba(255,255,255,.94);--surface2:#eef3fb;--surface3:#f8fafc;
  --border:rgba(36,54,101,.12);--border-strong:rgba(37,99,235,.22);--text:#122033;--text-dim:#64748b;--muted:#94a3b8;
  --accent:#1d4ed8;--green:#15803d;--green-dim:rgba(22,163,74,.12);--amber:#b7791f;--amber-dim:rgba(245,158,11,.14);
  --red:#b91c1c;--red-dim:rgba(239,68,68,.12);--purple:#7c3aed;--purple-dim:rgba(124,58,237,.10);
  --shadow:0 20px 55px rgba(15,23,42,.08);--shadow-soft:0 10px 30px rgba(15,23,42,.06);--radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{min-height:100vh;overflow-x:hidden;color:var(--text);font-family:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;background:radial-gradient(circle at top left,rgba(37,99,235,.14),transparent 30%),radial-gradient(circle at 90% 12%,rgba(20,184,166,.12),transparent 28%),linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.03) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 55%)}
.app{position:relative;z-index:1;max-width:1550px;margin:0 auto;padding:34px 34px 52px}.header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin-bottom:22px;padding:30px;border:1px solid var(--border);border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(239,246,255,.92)),var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative}.header::after{content:"";position:absolute;width:340px;height:340px;border-radius:999px;right:-145px;top:-170px;background:radial-gradient(circle,rgba(37,99,235,.18),transparent 70%)}.header>*{position:relative;z-index:1}.header h1{font-size:clamp(34px,4vw,54px);line-height:.98;letter-spacing:-1.8px;font-weight:900;max-width:980px}.header h1 span{color:var(--accent);background:linear-gradient(90deg,#1d4ed8,#0f766e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.header-sub{margin-top:14px;color:var(--text-dim);font-size:20px;font-weight:600;line-height:1.45}.period-badge{display:inline-flex;align-items:center;justify-content:center;min-width:220px;background:#fff;border:1px solid var(--border-strong);border-radius:999px;padding:14px 24px;color:var(--accent);font-weight:900;box-shadow:var(--shadow-soft);white-space:nowrap}.data-source{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--border);font-size:14px;font-weight:800;color:var(--text-dim)}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.12);display:inline-block}.nav-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding:7px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.68);box-shadow:0 8px 22px rgba(15,23,42,.04);scrollbar-width:thin}.nav-tab{padding:13px 20px;border-radius:13px;font-size:16px;font-weight:900;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text-dim);transition:all .2s ease;white-space:nowrap}.nav-tab:hover{color:var(--accent);background:rgba(37,99,235,.07)}.nav-tab.active{background:#fff;color:var(--accent);border-color:var(--border-strong);box-shadow:0 9px 22px rgba(37,99,235,.10)}
.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:18px}.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 22px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-soft);min-height:134px}.summary-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent)}.summary-card.green::before{background:linear-gradient(90deg,var(--green),#22c55e)}.summary-card.amber::before{background:linear-gradient(90deg,var(--amber),#f59e0b)}.summary-card.red::before{background:linear-gradient(90deg,var(--red),#ef4444)}.summary-card.purple::before{background:linear-gradient(90deg,var(--purple),#a78bfa)}.summary-card::after{content:"";position:absolute;right:-38px;top:-50px;width:120px;height:120px;border-radius:999px;background:rgba(37,99,235,.08)}.summary-card.green::after{background:var(--green-dim)}.summary-card.amber::after{background:var(--amber-dim)}.summary-card.red::after{background:var(--red-dim)}.summary-card.purple::after{background:var(--purple-dim)}.label{position:relative;z-index:1;font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-dim);margin-bottom:13px;font-weight:900}.value{position:relative;z-index:1;font-size:clamp(30px,3.5vw,42px);letter-spacing:-1.6px;line-height:1;font-weight:900}.sub{position:relative;z-index:1;font-size:15px;color:var(--text-dim);margin-top:12px;line-height:1.35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-soft);overflow:hidden}.panel.full{grid-column:1/-1}.panel-title{font-size:22px;font-weight:900;margin-bottom:5px;letter-spacing:-.4px}.panel-sub{font-size:16px;color:var(--text-dim);margin-bottom:18px;line-height:1.4}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.select,input[type="search"]{appearance:none;border:1px solid var(--border);background:#fff;border-radius:999px;padding:11px 14px;color:var(--text);font-size:14px;font-weight:800;min-width:190px}.notice{padding:16px 18px;border:1px solid var(--border-strong);background:rgba(37,99,235,.06);border-radius:18px;color:var(--text-dim);line-height:1.55;font-weight:700}.notice.warn{background:var(--amber-dim);border-color:rgba(245,158,11,.22);color:#7c4a03}.notice.bad{background:var(--red-dim);border-color:rgba(239,68,68,.18);color:var(--red)}
.table-wrap{width:100%;overflow:auto;border:1px solid var(--border);border-radius:18px;background:#fff}.data-table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}.data-table th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;padding:12px 13px;color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:.45px;font-weight:900;border-bottom:1px solid var(--border)}.data-table td{padding:11px 13px;border-bottom:1px solid rgba(15,23,42,.06);vertical-align:top;font-weight:700}.data-table tr:hover td{background:#f8fafc}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;color:var(--text-dim);white-space:nowrap}.chip.green{color:var(--green);background:var(--green-dim);border-color:rgba(22,163,74,.18)}.chip.amber{color:var(--amber);background:var(--amber-dim);border-color:rgba(245,158,11,.18)}.chip.red{color:var(--red);background:var(--red-dim);border-color:rgba(239,68,68,.18)}.chip.purple{color:var(--purple);background:var(--purple-dim);border-color:rgba(124,58,237,.18)}.bar-list{display:flex;flex-direction:column;gap:12px}.bar-row{display:grid;grid-template-columns:210px minmax(180px,1fr) 110px;align-items:center;gap:14px}.bar-label{font-size:14px;font-weight:900;color:var(--text-dim);text-align:right}.bar-track{height:30px;background:var(--surface2);border-radius:999px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(30,41,59,.04)}.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#0f766e);transition:width .8s ease}.bar-value{font-size:14px;font-weight:900;text-align:right}.tiny{font-size:12px;color:var(--text-dim);font-weight:800}.svg-wrap{width:100%;height:270px;border-radius:16px;background:linear-gradient(180deg,var(--surface3),#fff);border:1px solid rgba(15,23,42,.06);overflow:hidden}.footer-bar{text-align:center;padding:28px 0 8px;font-size:14px;color:var(--text-dim);border-top:1px solid var(--border);margin-top:36px}.loading{text-align:center;padding:70px 20px;color:var(--text-dim);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-soft);font-size:16px;font-weight:800}.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.header{grid-template-columns:1fr;align-items:start}.grid{grid-template-columns:1fr}.bar-row{grid-template-columns:120px minmax(100px,1fr) 80px}.app{padding:18px 14px}.header{padding:20px;border-radius:20px}.header h1{font-size:29px}.header-sub{font-size:16px}.panel{padding:16px}.nav-tab{font-size:13px;padding:10px 13px}.summary-row{grid-template-columns:1fr 1fr}.summary-card{min-height:115px;padding:16px}.value{font-size:25px}.label{font-size:11px}.sub{font-size:12px}.select,input[type="search"]{min-width:140px;width:100%}.toolbar{display:grid;grid-template-columns:1fr}}
@media print{body{background:#fff!important;font-size:11px}body::before,.nav-tabs,.toolbar{display:none!important}.header,.panel,.summary-card{box-shadow:none;border:1px solid #ddd;border-radius:6px;background:#fff!important}.app{padding:10px}.header{padding:16px}.header h1{font-size:24px}.header::after,.summary-card::after{display:none}.summary-row{gap:8px}.summary-card{padding:10px;min-height:auto}.value{font-size:20px}.data-table{font-size:10px}@page{margin:1.3cm;size:A4 landscape}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>Dashboard Fact Sheet <span>Cawangan Penjagaan</span></h1>
      <div class="header-sub">Bahagian Kesihatan Pergigian Negeri Sabah · Sumber tunggal: Master_Data</div>
      <div class="data-source"><span class="dot" id="sourceDot"></span><span id="sourceStatus">Memuatkan Master_Data...</span></div>
    </div>
    <div class="period-badge" id="periodBadge">Live CSV</div>
  </div>
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-view="overview">RINGKASAN</button>
    <button class="nav-tab" data-view="categories">KATEGORI</button>
    <button class="nav-tab" data-view="indicator">INDIKATOR</button>
    <button class="nav-tab" data-view="trend">TREND</button>
    <button class="nav-tab" data-view="ranking">RANKING KAWASAN</button>
    <button class="nav-tab" data-view="table">JADUAL DATA</button>
    <button class="nav-tab" data-view="quality">SEMAKAN DATA</button>
    <button class="nav-tab" data-view="setup">SETUP</button>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div><br>Memuatkan data daripada Master_Data...</div></div>
  <div class="footer-bar">Copyright &copy; Bahagian Kesihatan Pergigian Negeri Sabah. All rights reserved.</div>
</div>
<script>
// =======================================================
// MASTER DATA CONFIGURATION
// =======================================================
// Dashboard reads only this one published CSV tab.
const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIQGf-F_JZBE-PYUunzg_nlIMnrLsEQsgLUiIMWTWlvYLeAi2_lz4M27wGKRNBdv-Bua0Aqm9inBcs/pub?gid=808112216&single=true&output=csv";

let RAW_ROWS = [];
let DATA = [];
let FILTERS = { category:'All', section:'All', indicator:'All', year:'Latest', kawasan:'All', search:'' };
let ACTIVE_VIEW = 'overview';

const REQUIRED_HEADERS = ['Category','Section','Indicator_Code','Indicator_Name','Year','Period','Geography_Level','Kawasan','Subgroup','Numerator','Denominator','Value','Unit','Target','Direction','Source_Tab','Source_Cell','Remarks','Dashboard_Ready'];
const ERRORS = new Set(['#DIV/0!','#VALUE!','#REF!','#N/A','#NAME?','#NUM!','#ERROR!']);
const collator = new Intl.Collator('ms-MY', {numeric:true, sensitivity:'base'});

function esc(x){return String(x ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function norm(h){return String(h ?? '').trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');}
function isErr(v){return typeof v === 'string' && ERRORS.has(v.trim());}
function isBlank(v){return v === null || v === undefined || String(v).trim() === '';}
function toNum(v){
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (v === null || v === undefined) return null;
  let s = String(v).trim();
  if (!s || isErr(s) || s === '-') return null;
  s = s.replace(/,/g,'').replace(/%/g,'');
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
function fmtNum(v, unit=''){
  const n = toNum(v);
  if (n === null) return '—';
  const u = String(unit || '').toLowerCase();
  if (u.includes('%')) return n.toFixed(1) + '%';
  if (u.includes('mean') || u.includes('ppm')) return n.toFixed(2);
  if (Math.abs(n) >= 1000) return n.toLocaleString();
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}
function uniq(arr){return [...new Set(arr.filter(x=>!isBlank(x)).map(x=>String(x).trim()))].sort(collator.compare);}
function years(){return uniq(DATA.map(r=>r.Year)).filter(y=>/^20\d{2}$/.test(y)).map(Number).sort((a,b)=>a-b);}
function latestYear(){const ys=years(); return ys.length ? String(ys[ys.length-1]) : '';}
function readyRows(){return DATA.filter(r => toNum(r.Value) !== null && /^20\d{2}$/.test(String(r.Year||'')));}
function statusClass(value, target, direction){
  const n=toNum(value), t=toNum(target); if(n===null || t===null) return '';
  const d=String(direction||'').toLowerCase();
  if(d.includes('lower')){ if(n<=t) return 'green'; if(n<=t*1.3) return 'amber'; return 'red'; }
  if(d.includes('context')) return 'purple';
  if(n>=t) return 'green'; if(n>=t*.8) return 'amber'; return 'red';
}
function directionLabel(d){
  const s=String(d||'').toLowerCase();
  if(s.includes('lower')) return 'Lower better';
  if(s.includes('context')) return 'Context only';
  return 'Higher better';
}
function displayName(r){return r.Indicator_Name || r.Indicator_Code || 'Unknown indicator';}

function parseCSV(text){
  const rows=[]; let row=[]; let cur=''; let q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){
      if(q && text[i+1]==='"'){cur+='"'; i++;} else q=!q;
    } else if(ch===',' && !q){ row.push(cur); cur='';
    } else if((ch==='\n' || ch==='\r') && !q){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(cur); cur='';
      if(row.some(c=>String(c).trim()!=='')) rows.push(row.map(c=>c.trim()));
      row=[];
    } else cur+=ch;
  }
  row.push(cur);
  if(row.some(c=>String(c).trim()!=='')) rows.push(row.map(c=>c.trim()));
  return rows;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const header = rows[0].map(h=>String(h||'').trim());
  const nheader = header.map(norm);
  return rows.slice(1).map((row,idx)=>{
    const obj = {_row: idx+2};
    REQUIRED_HEADERS.forEach(h=>{
      const i=nheader.indexOf(norm(h)); obj[h]=i>=0 ? (row[i] ?? '') : '';
    });
    return obj;
  });
}
function validateHeaders(rows){
  if(!rows.length) return ['CSV has no rows.'];
  const got = rows[0].map(norm);
  const missing = REQUIRED_HEADERS.slice(0,12).filter(h => !got.includes(norm(h)));
  return missing.map(h=>`Missing required header: ${h}`);
}
async function loadData(){
  try{
    const res = await fetch(MASTER_CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    RAW_ROWS = parseCSV(text);
    const headerIssues = validateHeaders(RAW_ROWS);
    DATA = rowsToObjects(RAW_ROWS).filter(r => Object.values(r).some(v => !isBlank(v)));
    setSourceStatus(headerIssues.length ? 'warning' : 'ok', headerIssues.length ? `Live CSV loaded, but ${headerIssues.length} header issue(s)` : 'Live Master_Data CSV aktif');
  } catch(e){
    console.warn(e);
    setSourceStatus('bad', 'Gagal memuatkan CSV. Semak sharing/publish link atau internet.');
    DATA = [];
  }
  boot();
}
function setSourceStatus(type,msg){
  const dot=document.getElementById('sourceDot');
  const status=document.getElementById('sourceStatus');
  status.textContent=msg;
  if(type==='ok'){dot.style.background='var(--green)';dot.style.boxShadow='0 0 0 4px rgba(22,163,74,.12)';}
  else if(type==='warning'){dot.style.background='var(--amber)';dot.style.boxShadow='0 0 0 4px rgba(245,158,11,.18)';}
  else{dot.style.background='var(--red)';dot.style.boxShadow='0 0 0 4px rgba(239,68,68,.18)';}
}
function boot(){
  const y=latestYear();
  document.getElementById('periodBadge').textContent = y ? `Tahun Terkini: ${y}` : 'Master_Data';
  document.getElementById('navTabs').addEventListener('click',e=>{
    const btn=e.target.closest('.nav-tab'); if(!btn) return;
    document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); ACTIVE_VIEW=btn.dataset.view; render();
  });
  render();
}
function renderCards(cards){
  return `<div class="summary-row">${cards.map(c=>`<div class="summary-card ${c.color||''}"><div class="label">${esc(c.label)}</div><div class="value">${esc(c.value)}</div><div class="sub">${esc(c.sub||'')}</div></div>`).join('')}</div>`;
}
function baseFiltered(){
  const yr = FILTERS.year === 'Latest' ? latestYear() : FILTERS.year;
  return DATA.filter(r=>{
    if(FILTERS.category!=='All' && r.Category!==FILTERS.category) return false;
    if(FILTERS.section!=='All' && r.Section!==FILTERS.section) return false;
    if(FILTERS.indicator!=='All' && displayName(r)!==FILTERS.indicator) return false;
    if(FILTERS.year!=='All' && String(r.Year)!==String(yr)) return false;
    if(FILTERS.kawasan!=='All' && r.Kawasan!==FILTERS.kawasan) return false;
    if(FILTERS.search){
      const hay = [r.Category,r.Section,r.Indicator_Code,r.Indicator_Name,r.Year,r.Kawasan,r.Source_Tab,r.Remarks].join(' ').toLowerCase();
      if(!hay.includes(FILTERS.search.toLowerCase())) return false;
    }
    return true;
  });
}
function filterBar(opts={}){
  const cats = ['All',...uniq(DATA.map(r=>r.Category))];
  const sections = ['All',...uniq(DATA.filter(r=>FILTERS.category==='All'||r.Category===FILTERS.category).map(r=>r.Section))];
  const inds = ['All',...uniq(DATA.filter(r=>(FILTERS.category==='All'||r.Category===FILTERS.category)&&(FILTERS.section==='All'||r.Section===FILTERS.section)).map(displayName))];
  const yrs = ['Latest','All',...years().map(String)];
  const kws = ['All',...uniq(DATA.map(r=>r.Kawasan))];
  const sel=(id,val,list)=>`<select class="select" id="${id}">${list.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  return `<div class="toolbar">${opts.category===false?'':sel('fCategory',FILTERS.category,cats)}${opts.section===false?'':sel('fSection',FILTERS.section,sections)}${opts.indicator===false?'':sel('fIndicator',FILTERS.indicator,inds)}${opts.year===false?'':sel('fYear',FILTERS.year,yrs)}${opts.kawasan===false?'':sel('fKawasan',FILTERS.kawasan,kws)}${opts.search===false?'':`<input type="search" id="fSearch" placeholder="Cari indikator / tab / kawasan" value="${esc(FILTERS.search)}" />`}</div>`;
}
function bindFilters(){
  const set=(id,key)=>{const el=document.getElementById(id); if(el) el.onchange=()=>{FILTERS[key]=el.value; if(key==='category'){FILTERS.section='All';FILTERS.indicator='All';} if(key==='section') FILTERS.indicator='All'; render();};};
  set('fCategory','category'); set('fSection','section'); set('fIndicator','indicator'); set('fYear','year'); set('fKawasan','kawasan');
  const search=document.getElementById('fSearch'); if(search) search.oninput=()=>{FILTERS.search=search.value; render();};
}
function renderOverview(){
  const ready=readyRows(); const cats=uniq(DATA.map(r=>r.Category)); const indicators=uniq(DATA.map(displayName)); const kws=uniq(DATA.map(r=>r.Kawasan));
  const targetRows=ready.filter(r=>toNum(r.Target)!==null && !String(r.Direction||'').toLowerCase().includes('context'));
  const achieved=targetRows.filter(r=>statusClass(r.Value,r.Target,r.Direction)==='green').length;
  const bad=DATA.filter(r=>Object.values(r).some(isErr)).length;
  let html=renderCards([
    {label:'Jumlah baris Master_Data',value:DATA.length.toLocaleString(),sub:'Semua rows daripada CSV',color:'purple'},
    {label:'Dashboard-ready rows',value:ready.length.toLocaleString(),sub:'Ada Year dan Value numerik',color:ready.length?'green':'red'},
    {label:'Kategori',value:cats.length,sub:cats.join(' · ') || 'Belum ada data',color:'green'},
    {label:'Tahun terkini',value:latestYear() || '—',sub:`Julat: ${years().join(', ') || 'tiada'}`,color:'amber'},
    {label:'Indikator unik',value:indicators.length,sub:'Berdasarkan Indicator_Name',color:'purple'},
    {label:'Kawasan/Subjek',value:kws.length,sub:'Termasuk Sabah/WTP/kawasan',color:'green'},
    {label:'Rows capai sasaran',value:targetRows.length?`${achieved}/${targetRows.length}`:'—',sub:'Hanya row dengan Target',color: targetRows.length && achieved/targetRows.length>=.8?'green':'amber'},
    {label:'Rows error formula',value:bad,sub:'Contoh #DIV/0! jika masih wujud',color:bad?'red':'green'},
  ]);
  html += `<div class="grid"><div class="panel"><div class="panel-title">Keputusan reka bentuk</div><div class="panel-sub">Dashboard ini kini membaca satu tab sahaja: Master_Data.</div><div class="notice"><strong>Kelebihan:</strong> anda boleh tambah kategori, seksyen, indikator, kawasan dan tahun sebagai baris baharu dalam Master_Data. Dashboard akan auto-group tanpa perlu tambah URL tab baharu.</div></div><div class="panel"><div class="panel-title">Cara baca</div><div class="panel-sub">Ranking dan trend bergantung kepada medan Indicator_Name, Year, Kawasan dan Value.</div><div class="notice warn"><strong>Amaran:</strong> jangan ubah nama header utama dalam Master_Data. Menambah baris baharu adalah selamat; mengubah struktur kolum boleh menyebabkan paparan gagal.</div></div></div>`;
  document.getElementById('content').innerHTML=html;
}
function renderCategories(){
  const cats=uniq(DATA.map(r=>r.Category));
  let html=filterBar({indicator:false,kawasan:false,year:false,search:false});
  html += `<div class="grid">`;
  cats.forEach(cat=>{
    const rows=DATA.filter(r=>r.Category===cat); const ready=rows.filter(r=>toNum(r.Value)!==null); const sections=uniq(rows.map(r=>r.Section)); const indicators=uniq(rows.map(displayName)); const yrs=uniq(rows.map(r=>r.Year));
    html += `<div class="panel"><div class="panel-title">${esc(cat)}</div><div class="panel-sub">${sections.length} seksyen · ${indicators.length} indikator · ${ready.length}/${rows.length} rows ada nilai</div><div class="notice"><strong>Seksyen:</strong> ${esc(sections.slice(0,8).join(' · '))}${sections.length>8?' ...':''}<br><strong>Tahun:</strong> ${esc(yrs.join(', ')||'—')}</div></div>`;
  });
  html += `</div>`;
  document.getElementById('content').innerHTML=html; bindFilters();
}
function chooseIndicatorRows(){
  let rows=baseFiltered();
  if(FILTERS.indicator==='All'){
    const candidates=uniq(rows.filter(r=>toNum(r.Value)!==null).map(displayName));
    if(candidates.length){ FILTERS.indicator=candidates[0]; rows=baseFiltered(); }
  }
  return rows.filter(r=>toNum(r.Value)!==null);
}
function renderIndicator(){
  let html=filterBar({kawasan:false,search:false});
  const rows=chooseIndicatorRows();
  const name=FILTERS.indicator==='All'?'Pilih indikator':FILTERS.indicator;
  const latest=latestYear(); const rLatest=rows.filter(r=>String(r.Year)===String(FILTERS.year==='Latest'?latest:FILTERS.year));
  const sabah=rLatest.find(r=>String(r.Kawasan).toLowerCase()==='sabah');
  const vals=rLatest.map(r=>toNum(r.Value)).filter(v=>v!==null); const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  const sample=rLatest[0] || rows[0] || {};
  html += renderCards([
    {label:'Indikator',value:rows.length?rows.length:'—',sub:name,color:'purple'},
    {label:'Nilai Sabah',value:sabah?fmtNum(sabah.Value,sabah.Unit):'—',sub:sabah?`Tahun ${sabah.Year}`:'Tiada row Kawasan=Sabah',color:sabah?statusClass(sabah.Value,sabah.Target,sabah.Direction):'amber'},
    {label:'Purata kawasan',value:avg===null?'—':fmtNum(avg,sample.Unit),sub:'Simple average rows filtered',color:'green'},
    {label:'Target',value:sample.Target?fmtNum(sample.Target,sample.Unit):'—',sub:directionLabel(sample.Direction),color:'amber'},
  ]);
  html += `<div class="grid"><div class="panel">${trendPanel(rows,name)}</div><div class="panel">${rankingPanel(rows,name)}</div></div>`;
  document.getElementById('content').innerHTML=html; bindFilters();
}
function trendPanel(rows,title){
  const byYear=new Map();
  rows.filter(r=>String(r.Kawasan).toLowerCase()==='sabah').forEach(r=>byYear.set(String(r.Year),r));
  if(!byYear.size){
    rows.forEach(r=>{ if(!byYear.has(String(r.Year))) byYear.set(String(r.Year),r); });
  }
  const pts=[...byYear.entries()].filter(([y,r])=>/^20\d{2}$/.test(y)&&toNum(r.Value)!==null).sort((a,b)=>Number(a[0])-Number(b[0]));
  if(pts.length<2) return `<div class="panel-title">Trend Tahunan</div><div class="panel-sub">${esc(title)}</div><div class="notice warn">Trend memerlukan sekurang-kurangnya dua tahun data untuk indikator yang sama.</div>`;
  const values=pts.map(([y,r])=>toNum(r.Value)); const min=Math.min(...values), max=Math.max(...values); const pad= max===min ? 1 : (max-min)*.12; const ymin=min-pad, ymax=max+pad;
  const w=760,h=250,m={l:48,r:28,t:24,b:46}; const x=i=>m.l+(i*(w-m.l-m.r)/(pts.length-1)); const y=v=>m.t+(ymax-v)*(h-m.t-m.b)/(ymax-ymin);
  const line=pts.map(([yr,r],i)=>`${x(i)},${y(toNum(r.Value))}`).join(' ');
  const unit=pts[0][1].Unit;
  return `<div class="panel-title">Trend Tahunan</div><div class="panel-sub">${esc(title)} · ${pts[0][0]}–${pts[pts.length-1][0]}</div><div class="svg-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><line x1="${m.l}" y1="${h-m.b}" x2="${w-m.r}" y2="${h-m.b}" stroke="#cbd5e1"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${h-m.b}" stroke="#cbd5e1"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(([yr,r],i)=>`<circle cx="${x(i)}" cy="${y(toNum(r.Value))}" r="6" fill="var(--accent)"/><text x="${x(i)}" y="${h-18}" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">${yr}</text><text x="${x(i)}" y="${y(toNum(r.Value))-12}" text-anchor="middle" font-size="13" font-weight="900" fill="#122033">${fmtNum(r.Value,unit)}</text>`).join('')}</svg></div>`;
}
function rankingPanel(rows,title){
  const yr=FILTERS.year==='Latest'?latestYear():FILTERS.year;
  let list=rows.filter(r=>String(r.Year)===String(yr)&&String(r.Kawasan).toLowerCase()!=='sabah'&&toNum(r.Value)!==null);
  if(!list.length) list=rows.filter(r=>String(r.Kawasan).toLowerCase()!=='sabah'&&toNum(r.Value)!==null).slice(0,10);
  if(!list.length) return `<div class="panel-title">Ranking Kawasan</div><div class="panel-sub">${esc(title)}</div><div class="notice warn">Tiada data Kawasan untuk ranking.</div>`;
  const lower=String(list[0].Direction||'').toLowerCase().includes('lower');
  list.sort((a,b)=> lower ? toNum(a.Value)-toNum(b.Value) : toNum(b.Value)-toNum(a.Value));
  const max=Math.max(...list.map(r=>Math.abs(toNum(r.Value))));
  return `<div class="panel-title">Ranking Kawasan</div><div class="panel-sub">${esc(title)} · Tahun ${esc(yr)}</div><div class="bar-list">${list.slice(0,15).map(r=>{const v=toNum(r.Value); const pct=max?Math.max(3,Math.abs(v)/max*100):0; return `<div class="bar-row"><div class="bar-label">${esc(r.Kawasan)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-value">${fmtNum(r.Value,r.Unit)}</div></div><div class="tiny" style="margin-left:224px;margin-top:-8px;">${esc(r.Section)} ${r.Target?`· Sasaran ${fmtNum(r.Target,r.Unit)}`:''}</div>`;}).join('')}</div>`;
}
function renderTrend(){
  let html=filterBar({kawasan:false,year:false,search:false});
  const rows=chooseIndicatorRows();
  html += `<div class="panel full">${trendPanel(rows, FILTERS.indicator)}</div>`;
  document.getElementById('content').innerHTML=html; bindFilters();
}
function renderRanking(){
  let html=filterBar({kawasan:false,search:false});
  const rows=chooseIndicatorRows();
  html += `<div class="panel full">${rankingPanel(rows, FILTERS.indicator)}</div>`;
  document.getElementById('content').innerHTML=html; bindFilters();
}
function renderTable(){
  let html=filterBar({});
  const rows=baseFiltered();
  const show=rows.slice(0,1000);
  html += `<div class="panel full"><div class="panel-title">Jadual Master_Data</div><div class="panel-sub">Memaparkan ${show.length.toLocaleString()} daripada ${rows.length.toLocaleString()} rows selepas filter. Had paparan: 1000 rows.</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Category</th><th>Section</th><th>Indicator</th><th>Year</th><th>Kawasan</th><th>Value</th><th>Target</th><th>Status</th><th>Source Tab</th></tr></thead><tbody>${show.map(r=>{const cls=statusClass(r.Value,r.Target,r.Direction); return `<tr><td>${esc(r.Category)}</td><td>${esc(r.Section)}</td><td>${esc(displayName(r))}<div class="tiny">${esc(r.Indicator_Code)}</div></td><td>${esc(r.Year)}</td><td>${esc(r.Kawasan)}</td><td><strong>${fmtNum(r.Value,r.Unit)}</strong><div class="tiny">${esc(r.Unit)}</div></td><td>${fmtNum(r.Target,r.Unit)}</td><td>${cls?`<span class="chip ${cls}">${cls==='green'?'Capai':cls==='amber'?'Hampir':cls==='red'?'Belum':'Konteks'}</span>`:'<span class="chip">—</span>'}</td><td>${esc(r.Source_Tab)}<div class="tiny">${esc(r.Source_Cell)}</div></td></tr>`;}).join('')}</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=html; bindFilters();
}
function renderQuality(){
  const rows=DATA; const missingYear=rows.filter(r=>!/^20\d{2}$/.test(String(r.Year||''))).length; const missingValue=rows.filter(r=>toNum(r.Value)===null).length; const notReady=rows.filter(r=>String(r.Dashboard_Ready||'').toLowerCase()==='no').length; const errorRows=rows.filter(r=>Object.values(r).some(isErr));
  let html=renderCards([
    {label:'Missing / invalid Year',value:missingYear,sub:'Year mesti format 2025',color:missingYear?'red':'green'},
    {label:'Missing / invalid Value',value:missingValue,sub:'Value mesti numerik untuk chart',color:missingValue?'amber':'green'},
    {label:'Dashboard_Ready = No',value:notReady,sub:'Semak formula source cell',color:notReady?'amber':'green'},
    {label:'Formula error rows',value:errorRows.length,sub:'#DIV/0!, #VALUE!, etc.',color:errorRows.length?'red':'green'},
  ]);
  const bad=rows.filter(r=>toNum(r.Value)===null || !/^20\d{2}$/.test(String(r.Year||'')) || Object.values(r).some(isErr)).slice(0,250);
  html += `<div class="panel full"><div class="panel-title">Rows yang perlu disemak</div><div class="panel-sub">Paparan 250 rows pertama yang tidak lengkap / tidak numerik / error.</div>${bad.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Row</th><th>Indicator</th><th>Year</th><th>Kawasan</th><th>Value</th><th>Source</th><th>Issue</th></tr></thead><tbody>${bad.map(r=>{let issue=[]; if(!/^20\d{2}$/.test(String(r.Year||''))) issue.push('Year invalid'); if(toNum(r.Value)===null) issue.push('Value invalid/blank'); if(Object.values(r).some(isErr)) issue.push('Formula error'); return `<tr><td>${r._row}</td><td>${esc(displayName(r))}<div class="tiny">${esc(r.Indicator_Code)}</div></td><td>${esc(r.Year)}</td><td>${esc(r.Kawasan)}</td><td>${esc(r.Value)}</td><td>${esc(r.Source_Tab)} ${esc(r.Source_Cell)}</td><td><span class="chip red">${esc(issue.join(' · '))}</span></td></tr>`;}).join('')}</tbody></table></div>`:`<div class="notice"><strong>Bagus:</strong> tiada isu kritikal dikesan dalam Master_Data.</div>`}</div>`;
  document.getElementById('content').innerHTML=html;
}
function renderSetup(){
  const example=`const MASTER_CSV_URL = "${MASTER_CSV_URL}";`;
  document.getElementById('content').innerHTML=`<div class="panel full"><div class="panel-title">Setup Google Sheet Master_Data</div><div class="panel-sub">Dashboard ini sudah menggunakan satu published CSV URL untuk tab Master_Data.</div><div class="notice"><strong>Link aktif:</strong><br><code>${esc(MASTER_CSV_URL)}</code><br><br>Untuk update data, masukkan data dalam Google Sheet asal. Jangan edit CSV. Selepas refresh dashboard, data baharu akan dipaparkan.</div><pre style="white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:16px;padding:18px;margin-top:18px;overflow:auto;font-size:13px;line-height:1.5;">${esc(example)}</pre><div class="notice warn" style="margin-top:18px;"><strong>Peraturan penting:</strong> boleh tambah baris baharu untuk kategori/seksyen/indikator/tahun/kawasan. Tetapi jangan ubah nama header utama dalam Master_Data.</div></div>`;
}
function render(){
  if(!DATA.length){document.getElementById('content').innerHTML=`<div class="panel full"><div class="panel-title">Tiada data dapat dipaparkan</div><div class="panel-sub">Dashboard shell berfungsi, tetapi CSV tidak dapat dibaca atau Master_Data kosong.</div><div class="notice bad">Semak bahawa tab Master_Data telah dipublish sebagai CSV, link boleh diakses, dan header bermula pada row pertama.</div></div>`;return;}
  if(ACTIVE_VIEW==='overview') renderOverview();
  else if(ACTIVE_VIEW==='categories') renderCategories();
  else if(ACTIVE_VIEW==='indicator') renderIndicator();
  else if(ACTIVE_VIEW==='trend') renderTrend();
  else if(ACTIVE_VIEW==='ranking') renderRanking();
  else if(ACTIVE_VIEW==='table') renderTable();
  else if(ACTIVE_VIEW==='quality') renderQuality();
  else if(ACTIVE_VIEW==='setup') renderSetup();
}
loadData();
</script>
